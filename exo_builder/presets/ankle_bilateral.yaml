# Bilateral ankle exoskeleton: shank shell + foot plate, no belt.
name: ankle_bilateral
pelvis_unit: {enabled: false}
segments:
  thigh: {enabled: false}
  shank:
    mass: 0.7
    cuffs:
      - {name: shank_cuff, along_segment: 0.3, width: 0.07, stiffness_translational: {anteroposterior: 5645, mediolateral: 5645}, damping_translational: {anteroposterior: 418, mediolateral: 418}}
  foot: {mass: 0.5, mode: bushing}
