# Full bilateral lower-limb exoskeleton (hip + knee + ankle, both sides).
# Template: every key is optional; omitted keys take the values from
# exo_builder/config.py::DEFAULTS (where PARAM_DOCS documents each parameter).
# Units: angles in degrees, lengths in m, masses in kg, torques in N.m.
# "{s}" is replaced by the side letter (r / l).
#
# Coupling directions (cuffs, belt attach, foot binding) use the cuff frame:
#   anteroposterior = X, forward (+) / backward
#   longitudinal    = Y, along the segment, + towards the proximal joint (up)
#   mediolateral    = Z, + to the right of the body
name: full_bilateral
sides: [r, l]                 # [r] or [l] -> unilateral exo

human:                        # names in the human .osim model
  pelvis: pelvis
  bodies: {thigh: "femur_{s}", shank: "tibia_{s}", foot: "calcn_{s}", toes: "toes_{s}"}
  joints: {hip: "hip_{s}", knee: "walker_knee_{s}", ankle: "ankle_{s}"}
  floor: floor                # ContactHalfSpace used by the foot contact spheres
  radius_ratio: {thigh: [0.20, 0.13], shank: [0.12, 0.07]}   # limb radius / segment length [proximal, distal]
  use_markers: true           # refine limb radius with knee/ankle markers when present

pelvis_unit:                  # belt + backpack; enabled: false for exos without a belt
  enabled: true
  mass: 2.0                   # kg (belt)
  belt: {offset: [-0.02, 0.0, 0.0], height: 0.06, clearance: 0.03}   # m
  backpack: {enabled: true, mass: 3.0, size: [0.10, 0.30, 0.25], offset: [-0.16, 0.12, 0.0]}  # kg, m [depth, height, width]
  attach:                     # belt <-> human pelvis. model: linear | nonlinear | weld
    model: linear
    stiffness_translational: {anteroposterior: 20000, longitudinal: 20000, mediolateral: 20000}  # N/m
    stiffness_rotational: {anteroposterior: 300, longitudinal: 300, mediolateral: 300}           # N.m/rad
    damping_translational: {anteroposterior: 300, longitudinal: 300, mediolateral: 300}          # N.s/m
    damping_rotational: {anteroposterior: 5, longitudinal: 5, mediolateral: 5}                   # N.m.s/rad

cuff_defaults:                # applied to every cuff; each cuff may override any key
  along_segment: 0.5          # 0 = proximal joint (e.g. hip), 1 = distal joint (e.g. knee)
  width: 0.07                 # m, cuff width along the limb
  radius: auto                # m, limb radius at the cuff, or auto
  offset: [0, 0, 0]           # m, extra shift of the cuff centre [anteroposterior, longitudinal, mediolateral]
  model: linear               # linear | nonlinear | ring | sliding | contact (see README "Cuff models")
  stiffness_translational: {anteroposterior: 3283, longitudinal: 1000, mediolateral: 3283}   # N/m
  stiffness_rotational: {anteroposterior: 30, longitudinal: 5, mediolateral: 30}              # N.m/rad
  damping_translational: {anteroposterior: 367, longitudinal: 100, mediolateral: 367}         # N.s/m
  damping_rotational: {anteroposterior: 1.0, longitudinal: 0.2, mediolateral: 1.0}            # N.m.s/rad
  stiffness_cubic: {anteroposterior: 0, longitudinal: 0, mediolateral: 0}                     # N/m^3 (nonlinear: F = k*d + k3*d^3)
  # The values above are the soft tissue (linear, nonlinear, and the tissue of ring/sliding).
  ring:                       # model ring (and the ring of sliding)
    mass: auto                # kg, or auto = the cuff's share of the segment mass
    strap:                    # ring <-> exo, in series with the tissue
      stiffness_translational: {anteroposterior: 50000, longitudinal: 50000, mediolateral: 50000}
      stiffness_rotational: {anteroposterior: 500, longitudinal: 500, mediolateral: 500}
      damping_translational: {anteroposterior: 50, longitudinal: 50, mediolateral: 50}
      damping_rotational: {anteroposterior: 0.3, longitudinal: 0.3, mediolateral: 0.3}
  sliding:                    # model sliding: slide/twist on the limb against friction
    friction_coefficient: 0.5
    normal_force: 50          # N, strap pressure on the limb; slip when |F_axial| > mu*N
    transition_velocity: 0.005  # m/s (smooth Coulomb)
    viscous_damping: 5        # N.s/m
  contact:                    # model contact: compression-only pads with friction
    pads_around: 8
    rows: 2
    pad_radius: 0.03          # m
    shell_arc: 180            # deg of rigid shell, centred on the bar side; the rest is strap
    stiffness_shell: 4.0e+4   # N/m^2 (defaults ~ as stiff as the linear cuff for small motions)
    stiffness_strap: 1.5e+4   # N/m^2
    preload_force: 3          # N per pad at the reference pose (strap tightness)
    dissipation: 1.0          # s/m (Hunt-Crossley)
    static_friction: 0.5
    dynamic_friction: 0.4
    viscous_friction: 0.0
    transition_velocity: 0.01 # m/s

segments:
  thigh:
    enabled: true
    mass: 1.5                 # kg (bar + cuffs)
    bar_radius: 0.012         # m
    clearance: 0.015          # m, gap between the skin and the lateral bar
    cuffs:
      - {name: thigh_cuff, along_segment: 0.5, width: 0.08}
  shank:
    enabled: true
    mass: 1.0
    bar_radius: 0.010
    clearance: 0.015
    cuffs:
      - name: shank_cuff
        along_segment: 0.4
        width: 0.06
        stiffness_translational: {anteroposterior: 5645, mediolateral: 5645}
        damping_translational: {anteroposterior: 418, mediolateral: 418}
  foot:
    enabled: true
    mass: 0.6
    mode: bushing             # weld | bushing | plate_contact
    plate: {thickness: 0.008, length: auto, width: auto, margin: 0.01}   # m
    binding:                  # shoe strap (bushing and plate_contact modes)
      model: linear
      stiffness_translational: {anteroposterior: 50000, longitudinal: 50000, mediolateral: 50000}
      stiffness_rotational: {anteroposterior: 200, longitudinal: 200, mediolateral: 200}
      damping_translational: {anteroposterior: 500, longitudinal: 500, mediolateral: 500}
      damping_rotational: {anteroposterior: 5, longitudinal: 5, mediolateral: 5}

joints:
  # dofs keys: enabled, actuated, max_torque (N.m), range [deg], default [deg],
  # limits: clamp | soft (CoordinateLimitForce) | none, limit_stiffness (N.m/deg), limit_damping,
  # passive_stiffness (N.m/rad), passive_damping (N.m.s/rad), human_coord,
  # axis: human | [x, y, z] (pelvis frame, right side)
  hip:
    misalignment: [0, 0, 0]   # m, exo joint centre - human joint centre (pelvis frame, right side)
    dofs:
      flexion: {enabled: true, actuated: true, max_torque: 100, range: [-40, 120], human_coord: "hip_flexion_{s}"}
      adduction: {enabled: true, actuated: false, range: [-30, 30], human_coord: "hip_adduction_{s}"}
      rotation: {enabled: true, actuated: false, range: [-40, 40], human_coord: "hip_rotation_{s}"}  # passive: lets the leg follow tibial rotation
  knee:
    misalignment: [0, 0, 0]
    dofs:
      flexion: {enabled: true, actuated: true, max_torque: 80, range: [-10, 120], human_coord: "knee_angle_{s}"}
  ankle:
    misalignment: [0, 0, 0]
    dofs:
      flexion: {enabled: true, actuated: true, max_torque: 60, range: [-40, 30], human_coord: "ankle_angle_{s}"}
      inversion: {enabled: false, actuated: false, range: [-20, 20], human_coord: "subtalar_angle_{s}", axis: [1, 0, 0]}

overrides: {}                 # e.g. {l: {segments: {thigh: {mass: 1.2}}}}
