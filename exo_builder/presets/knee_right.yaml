# Unilateral (right) knee exoskeleton without belt: thigh and shank shells,
# the thigh shell floats (6-DOF root joint) and is held only by its cuffs.
name: knee_right
sides: [r]
pelvis_unit: {enabled: false}
segments:
  foot: {enabled: false}
  thigh:
    mass: 0.8
    cuffs:
      - {name: thigh_cuff_prox, along_segment: 0.35, width: 0.07}
      - {name: thigh_cuff_dist, along_segment: 0.75, width: 0.07}
  shank:
    mass: 0.6
    cuffs:
      - {name: shank_cuff, along_segment: 0.3, width: 0.06, stiffness_translational: {anteroposterior: 5645, mediolateral: 5645}, damping_translational: {anteroposterior: 418, mediolateral: 418}}
