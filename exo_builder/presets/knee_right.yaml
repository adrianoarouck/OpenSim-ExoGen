# Unilateral (right) knee exoskeleton without belt: thigh and shank shells,
# the thigh shell floats (FreeJoint) and is held only by its cuffs.
name: knee_right
sides: [r]
pelvis_unit: {enabled: false}
segments:
  foot: {enabled: false}
  thigh:
    mass: 0.8
    cuffs:
      - {name: thigh_cuff_prox, at: 0.35, width: 0.07}
      - {name: thigh_cuff_dist, at: 0.75, width: 0.07}
  shank:
    mass: 0.6
    cuffs:
      - {name: shank_cuff, at: 0.3, width: 0.06, translational: {ap: 5645, ml: 5645}, translational_damping: {ap: 418, ml: 418}}
